[package]
name = "opencena"
version = "0.9.2"
description = "OpenCena: roteiro, quadrinhos e livros, offline"
authors = ["OpenCena"]
license = "GPL-3.0-or-later"
repository = ""
edition = "2021"

[lib]
name = "opencena_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[profile.release]
# instalador menor
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
